# Build Scarlett MixControl on macOS and publish a GitHub release with
# Scarlett.MixControl.app.zip attached.  Tags containing "beta" become
# pre-releases; any other tag becomes a regular release marked Latest.
#
# How to release:
#   1. Push a tag:  git tag vX.Y.Z && git push origin vX.Y.Z
#                   (or vX.Y.Z-beta.N for a pre-release)
#   2. Or GitHub → Actions → "Release" → Run workflow with a tag
#
# The tag is the only place the version lives; make-app.sh takes it from
# APP_VERSION here and from `git describe` for local builds.
#
# Download: repo → Releases → Scarlett.MixControl.app.zip

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1 or v0.2.1-beta.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history: make-app.sh's build number is the commit count

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Resolve release tag
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            echo "No release tag: push a v* tag or pass one when running the workflow." >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Invalid tag: $TAG (expected vX.Y.Z or vX.Y.Z-beta.N)" >&2
            exit 1
          fi
          # A manual run for an existing tag must build that tag's commit, not
          # the branch it was started from.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
          fi
          # The commit actually built; a new tag is created here too.
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build .app and zip
        env:
          APP_VERSION: ${{ steps.version.outputs.tag }}
        run: ./scripts/make-release.sh

      - name: Compute checksum
        id: checksum
        run: |
          SHA=$(shasum -a 256 "build/Scarlett.MixControl.app.zip" | awk '{print $1}')
          SIZE=$(stat -f '%z' "build/Scarlett.MixControl.app.zip")
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size_kb=$((SIZE / 1024))" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.version.outputs.commit }}
          name: Scarlett MixControl ${{ steps.version.outputs.tag }}
          prerelease: ${{ contains(steps.version.outputs.tag, 'beta') }}
          make_latest: ${{ !contains(steps.version.outputs.tag, 'beta') }}
          generate_release_notes: true
          files: build/Scarlett.MixControl.app.zip
          body: |
            ## Install (macOS 14+)

            1. Download **`Scarlett.MixControl.app.zip`** below.
            2. Unzip and drag **Scarlett MixControl.app** to `/Applications`.
            3. **First launch** (ad-hoc codesign, not notarized): open the app, click **Done** on the warning, then
               **System Settings → Privacy & Security → Open Anyway** and confirm. macOS won't ask again.
               Or: `xattr -dr com.apple.quarantine "/Applications/Scarlett MixControl.app"`

            ### Supported hardware (1st gen)
            - **8i6**, **18i8**, **18i20** — confirmed on hardware
            - **6i6**, **18i6** — driven from MixControl's byte tables; awaiting full hardware confirmation

            ### Build info
            | | |
            |---|---|
            | Commit | `${{ steps.version.outputs.commit }}` |
            | Workflow run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | ZIP size | ${{ steps.checksum.outputs.size_kb }} KB |
            | SHA-256 | `${{ steps.checksum.outputs.sha256 }}` |
